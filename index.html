function showCard(item, trigger) {
  returnFocus = trigger;
  find("detail-title").textContent = item.titulo;
  const body = find("detail");
  body.replaceChildren();
  const table = create("table");
  for (const [label, value] of Object.entries(item.campos)) {
    const row = table.insertRow();
    const heading = create("th", label);
    heading.scope = "row";
    row.append(heading);
    addInline(row.insertCell(), value);
  }
  body.append(table);
  for (const section of item.secciones) {
    body.append(create("h3", section.titulo));
    let list;
    for (const line of section.lineas) {
      if (line.startsWith("- ")) {
        if (!list) { list = create("ul"); body.append(list); }
        const li = create("li");
        addInline(li, line.slice(2));
        list.append(li);
      } else if (line.trim()) {
        list = undefined;
        const paragraph = create("p");
        addInline(paragraph, line);
        body.append(paragraph);
      } else list = undefined;
    }
  }
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}
function cardButton(item, label, style = "btn") {
  const button = create("button", label, style);
  button.type = "button";
  button.addEventListener("click", () => showCard(item, button));
  return button;
}
function makeCard(item) {
  const card = create("article", undefined, "card");
  const meta = create("div", undefined, "card-meta");
  const state = normalize(item.estado);
  const color = state === "orientativo" ? "guide" : state === "pendiente" ? "pending" :
    /recurrido|anulado|decaido/.test(state) ? "appealed" :
    /vigente|firme/.test(state) ? "active" : /tramitacion|diferida/.test(state) ? "deferred" : "";
  meta.append(create("span", typeLabel[item.tipo] || item.tipo), create("span", "·"),
    create("span", displayScope(item)), create("span", item.estado, "badge " + color));
  const owner = create("p", item.organismo + " · " + formatDate(item.fecha), "muted");
  const actions = create("div", undefined, "actions");
  if (allowedUrl(item.url)) actions.append(officialLink(item.url, "Fuente oficial"));
  actions.append(cardButton(item, "Ver ficha"));
  card.append(meta, create("h3", item.titulo), owner, create("p", item.resumen, "abstract"), actions);
  return card;
}
function filterDocuments() {
  const words = normalize(find("search").value).trim().split(/\s+/).filter(Boolean);
  visible = library.documentos.filter((item) => {
    const corpus = normalize([item.titulo,item.organismo,item.resumen,item.temas].join(" "));
    return words.every((word) => corpus.includes(word)) && fields.every(([key,, get]) => {
      const value = selectByField.get(key).value;
      return !value || get(item).includes(value);
    });
  });
  find("cards").replaceChildren(...(visible.length ? visible.map(makeCard) :
    [create("p", "No hay documentos que coincidan con la búsqueda.", "empty")]));
  find("count").textContent = visible.length + " de " + library.documentos.length + " documentos";
  find("export").disabled = visible.length === 0;
}
for (const [key,label,get] of fields) {
  const wrapper = create("label", label);
  const select = create("select");
  select.id = "filter-" + key;
  wrapper.htmlFor = select.id;
  select.append(new Option(key === "tipo" || key === "tema" || key === "estado" ? "Todos" : key === "ambito" ? "Todos" : "Cualquiera", ""));
  const values = [...new Set(library.documentos.flatMap(get).filter(Boolean))];
  for (const value of values.sort(sort)) select.append(new Option(key === "tipo" ? typeLabel[value] || value : value, value));
  wrapper.append(select);
  find("filters").append(wrapper);
  selectByField.set(key, select);
  select.addEventListener("change", filterDocuments);
}
find("search").addEventListener("input", filterDocuments);
find("clear").addEventListener("click", () => {
  find("search").value = "";
  for (const select of selectByField.values()) select.value = "";
  filterDocuments();
  find("search").focus();
});
function csvCell(value) {
  const text = String(value ?? "");
  const safe = /^[\s\u0000-\u001f]*[=+@-]/.test(text) ? "'" + text : text;
  return '"' + safe.replaceAll('"','""') + '"';
}
find("export").addEventListener("click", () => {
  if (!visible.length) return;
  const lines = [library.columnas, ...visible.map((item) => library.columnas.map((key) => item[key]))];
  const csv = "\uFEFF" + lines.map((row) => row.map(csvCell).join(";")).join("\r\n") + "\r\n";
  const objectUrl = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const link = create("a");
  link.href = objectUrl;
  link.download = "biblioteca-filtrada.csv";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
});
find("close").addEventListener("click", () => dialog.close());
dialog.addEventListener("close", () => returnFocus?.focus());
find("updated").dateTime = library.actualizado;
find("updated").textContent = library.actualizado;
const cutoff = new Date(library.actualizado + "T00:00:00Z");
cutoff.setUTCDate(cutoff.getUTCDate() - 27);
const inPeriod = (date) => /^\d{4}-\d{2}-\d{2}$/.test(date || "") &&
  date >= cutoff.toISOString().slice(0,10) && date <= library.actualizado;
const recent = library.documentos.filter((item) => inPeriod(item.fecha_alta))
  .sort((a,b) => b.fecha_alta.localeCompare(a.fecha_alta) || sort(a.titulo,b.titulo));
if (recent.length) {
  const details = create("details");
  details.append(create("summary", recent.length + (recent.length === 1 ? " documento añadido" : " documentos añadidos")));
  const list = create("ul");
  for (const item of recent) {
    const li = create("li");
    li.append(cardButton(item, item.titulo, "text-button"), " · " + item.fecha_alta);
    list.append(li);
  }
  details.append(list);
  find("recent").append(details);
} else find("recent").append(create("p", "Sin incorporaciones en el periodo.", "muted"));
const changes = library.cambios.filter((change) => inPeriod(change.fecha));
if (changes.length) {
  const list = create("ul");
  for (const change of changes) {
    const li = create("li", change.fecha + " · " + change.id + " · " + change.anterior + " a " + change.nuevo);
    if (allowedUrl(change.fuente)) li.append(" · ", officialLink(change.fuente, "Fuente"));
    list.append(li);
  }
  find("changes").append(list);
} else find("changes").append(create("p", "Sin cambios de estado confirmados en los informes del periodo.", "muted"));
const events = library.documentos.flatMap((item) => item.fechasClave.map((event) => ({item,...event})))
  .sort((a,b) => a.fecha.localeCompare(b.fecha) || sort(a.item.titulo,b.item.titulo));
for (const {fecha,texto,item} of events) {
  const li = create("li", undefined, "event");
  const date = create("time", fecha);
  date.dateTime = fecha;
  const description = create("div");
  description.append(create("p", texto), cardButton(item, item.titulo, "text-button"));
  li.append(date,description);
  find("timeline").append(li);
}
if (!events.length) find("timeline").append(create("li", "No hay fechas clave confirmadas."));
filterDocuments();
</script>
